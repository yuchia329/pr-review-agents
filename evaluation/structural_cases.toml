# The Structural cases of the evaluation. `tools/structural_cases.py` says how they are read.
#
# Each table is one real commit. `title` and `description` are what a pull request for it would
# say, written by hand so that every Claim in the text is Structural and has the one answer.
# Where there is a false case, the text says nothing of how the code was before. `key` is the answer key, which the system is never shown. An entry with
# `left_out_of_false_case` also gives a false case: the same text over the same commit, without
# the commit's change to those files.

