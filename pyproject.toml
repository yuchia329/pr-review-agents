[project]
name = "pr-verification"
version = "0.1.0"
description = "Verifies the Claims a pull request makes about its own changes."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "packaging>=24",
]

[project.scripts]
pr-verification = "pr_verification.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_verification"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]

[tool.mypy]
strict = true
files = ["src", "tests", "tools"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
