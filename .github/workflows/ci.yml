name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - name: Tests are locked on impl/ branches
        if: github.event_name == 'pull_request'
        # Branch names come from the pull request, so they reach the shell only as environment.
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: python3 tools/tests_lock.py pull-request --branch "$HEAD_REF" --base "origin/$BASE_REF"
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest
